[toolchain]
channel = "nightly"
targets = ["x86_64-unknown-none"]
# rust-src + llvm-tools are needed by the `bootloader` crate's build: it
# build-std's its BIOS/UEFI boot stages (rust-src) and objcopies them to
# flat binaries (llvm-tools). Without these a fresh clone fails to build.
components = ["rust-src", "llvm-tools"]
